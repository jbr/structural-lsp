[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax). Unix only:
# process groups and signal handling are unix-specific (process/publishing.md).
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Whether dist should create a Github Release or use an existing draft
create-release = false

# The one program the archives carry; the development binaries under
# `src/bin/` stay out, as they stay out of the crates.io package.
[dist.binaries]
aarch64-apple-darwin = ["structural-lsp"]
x86_64-apple-darwin = ["structural-lsp"]
aarch64-unknown-linux-gnu = ["structural-lsp"]
x86_64-unknown-linux-gnu = ["structural-lsp"]

# aarch64-apple-darwin builds on macos-latest rather than dist's default
# macos-14, which GitHub left unacquired for want of arm64 capacity while
# macos-latest jobs ran (the v0.1.1 release).
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-latest"

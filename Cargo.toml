[package]
name = "structural"
version = "0.1.0"
edition = "2024"

[features]
# Compiles pending acceptance cases (none today; process/testing.md).
# Off by default: neither `cargo test` nor `cargo test -- --ignored` runs
# known-outcome-unproven cases; they are run explicitly with `--features
# pending-acceptance` (process/testing.md).
pending-acceptance = []

[dependencies]
anyhow = "1"
clap = "4.6"
lsp-types = "0.97"
mcplease = "0.4.2"
notify = "8.2.0"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
swansong = "0.3.6"
toml = "0.8"
tree-sitter = "0.27"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
url = "2"

[patch.crates-io]
mcplease = { path = "../mcplease" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

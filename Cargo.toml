[package]
name = "structural"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = "4.6"
lsp-types = "0.97"
mcplease = "0.4.2"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swansong = "0.3.6"
toml = "0.8"
tree-sitter = "0.27"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
url = "2"

[patch.crates-io]
mcplease = { path = "../mcplease" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

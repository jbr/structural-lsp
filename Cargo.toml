[package]
name = "structural-lsp"
version = "0.1.1"
edition = "2024"
description = "An MCP server that gives coding agents LSP-backed definition, references and rename"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jbr/structural-lsp"
readme = "README.md"
keywords = ["mcp", "lsp", "language-server", "agent"]
categories = ["development-tools", "command-line-utilities"]
# The package carries the library, the `structural-lsp` binary and the
# fixtures it compiles in. The development binaries under `src/bin/` stay
# out, so `cargo install` installs one program (process/publishing.md).
exclude = [
    "/src/bin/",
    "/tests/",
    "/docs/",
    "/process/",
    "/reference/",
    "/journal/",
    "/backlog/",
    "/.github/",
    "/CLAUDE.md",
    "/efference.toml",
    "/scripts/",
    "/dist-workspace.toml",
    "/release-plz.toml",
]

[features]
# Compiles pending acceptance cases (none today; process/testing.md).
# Off by default: neither `cargo test` nor `cargo test -- --ignored` runs
# known-outcome-unproven cases; they are run explicitly with `--features
# pending-acceptance` (process/testing.md).
pending-acceptance = []

[dependencies]
anyhow = "1"
clap = "4.6"
lsp-types = "0.97"
mcplease = "0.5.0"
notify = "8.2.1"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
swansong = "0.3.7"
toml = "1.1"
tree-sitter = "0.27"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.4"

# The profile that 'dist' will build with: the release profile with fat LTO,
# a one-time cost in release CI paid for every downloaded binary.
[profile.dist]
inherits = "release"
lto = "fat"

# Generates the public repository from this one on every push to main, by
# running scripts/publish (process/publishing.md). Runs only in the
# development repository; the push uses a deploy key with write access to
# the public repository, so the public side's own workflows run on it.
name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One publish at a time, in push order: each is a fast-forward of the last.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to the public repository
    if: github.repository == 'jbr/structural-lsp-private'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # +stable: josh's `allocative` dependency does not build on nightly
      # (process/publishing.md).
      - uses: dtolnay/rust-toolchain@stable
      - name: Install josh-filter
        uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: josh-cli
          git: https://github.com/josh-project/josh
          tag: r26.08.28
          locked: true
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PUBLIC_DEPLOY_KEY }}
      - name: Publish
        run: scripts/publish

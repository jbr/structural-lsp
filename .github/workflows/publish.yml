# Generates the public repository from this one by running scripts/publish
# (process/publishing.md). Called by ci.yaml's publish job once a push to
# main has passed CI; workflow_dispatch publishes main without waiting for
# CI. Runs only in the development repository; the push uses a deploy key
# with write access to the public repository, so the public side's own
# workflows run on it.
name: Publish

on:
  workflow_call:
    secrets:
      PUBLIC_DEPLOY_KEY:
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to the public repository
    if: github.repository == 'jbr/structural-lsp-private'
    runs-on: ubuntu-latest
    # One publish at a time, a manual one included: each is a fast-forward
    # of the last. Job-level, so it applies when called from ci.yaml too.
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # +stable: josh's `allocative` dependency does not build on nightly
      # (process/publishing.md).
      - uses: dtolnay/rust-toolchain@stable
      - name: Install josh-filter
        uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: josh-cli
          git: https://github.com/josh-project/josh
          tag: r26.08.28
          locked: true
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PUBLIC_DEPLOY_KEY }}
      - name: Publish
        run: scripts/publish

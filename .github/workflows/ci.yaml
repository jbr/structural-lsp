name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

env:
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: Build and test
    if: github.repository != 'jbr/structural-lsp-private'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Unix only: process groups and signal handling are unix-specific,
        # and the non-unix front end has never been built.
        os: [ubuntu-latest, macOS-latest]
        rust: [stable, nightly]
    steps:
      - uses: actions/checkout@v6
      - name: Install ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      # The mock language server in the unit tests is a Python 3 script;
      # the real-server tests are `--ignored` and do not run here.
      - name: Tests
        run: cargo test

  lints_and_docs:
    name: Lints and docs
    if: github.repository != 'jbr/structural-lsp-private'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Docs
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  coverage:
    name: Coverage
    if: github.repository != 'jbr/structural-lsp-private'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Collect coverage data
        run: cargo llvm-cov --codecov --output-path codecov.json
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: codecov.json
          slug: jbr/structural-lsp
